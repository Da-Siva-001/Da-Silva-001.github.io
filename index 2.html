<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Special Ticket</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111}body{min-height:100svh;height:100svh;overflow:hidden;padding:8px;display:flex;align-items:center;justify-content:center;color:#f4dfb0;font-family:Georgia,"Times New Roman","Yu Mincho",serif;--chaos:0}
.ticket{width:min(720px,100%);position:relative;padding:30px 28px 26px;border:2px solid #c9a45a;background:radial-gradient(circle at 20% 20%,#292929 0 1px,transparent 2px),linear-gradient(135deg,#111,#1b1b1b);box-shadow:0 0 35px #000;z-index:3}.ticket:before{content:"";position:absolute;inset:11px;border:1px solid #7d6230;pointer-events:none}h1{text-align:center;margin:0;font-weight:500;font-size:clamp(34px,7vw,58px);letter-spacing:.05em}.sub{text-align:center;font-size:clamp(16px,3.5vw,24px);margin:15px 0 23px}.rule{height:1px;background:linear-gradient(90deg,transparent,#a88748 15%,#a88748 44%,transparent 44%,transparent 56%,#a88748 56%,#a88748 85%,transparent);position:relative}.rule:after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:#161616;padding:0 12px;color:#d7ae5c}.current{text-align:center;letter-spacing:.3em;font-size:13px;margin:24px 0 3px;color:#d8bd83}.count{text-align:center;font-size:clamp(110px,25vw,180px);line-height:1.02;font-weight:400;color:#f7dfad;position:relative;z-index:8}.buttons{width:min(500px,92%);margin:8px auto 0;position:relative;z-index:10}.plus,.reset{width:100%;font-family:inherit;cursor:pointer}.plus{height:68px;border:1px solid #c9a45a;background:#181818;color:#f5dfae;font-size:22px;letter-spacing:.08em}.reset{margin-top:14px;height:48px;border:1px solid #ff72a7;background:#d92f73;color:#fff1f7;font-size:15px}.footer{text-align:center;margin:26px 0 4px;font-size:13px;line-height:1.9;color:#c8aa6f}.glass-zone{height:310px;display:flex;align-items:center;justify-content:center;margin:12px 0 26px}.real-glass{position:relative;width:170px;height:290px}.bowl{position:absolute;top:14px;left:21px;width:128px;height:158px;border:2px solid rgba(255,255,255,.9);border-top:0;border-radius:5px 5px 62px 62px/5px 5px 110px 110px;overflow:hidden}.rim{position:absolute;z-index:3;top:9px;left:20px;width:130px;height:14px;border:2px solid #fff;border-radius:50%}.stem{position:absolute;top:169px;left:80px;width:10px;height:84px;background:linear-gradient(90deg,#777,#fff,#777)}.base{position:absolute;top:247px;left:36px;width:98px;height:20px;border:2px solid #eee;border-radius:50%}.liquid-body{position:absolute;left:-5px;right:-5px;bottom:-4px;height:0;display:none;background:rgb(var(--r),var(--g),var(--b));transition:height .55s}.liquid-wave{position:absolute;width:190%;left:-45%;height:54px;top:-25px;border-radius:50%;background:rgb(var(--r),var(--g),var(--b));animation:wave 2s ease-in-out infinite}.wave-front{top:-18px;opacity:.8;animation-direction:reverse}@keyframes wave{50%{transform:translateX(18%) rotate(5deg)}}.overflow{display:none;position:absolute;inset:0;pointer-events:none}.puddle{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:285px;height:65px;border-radius:50%;background:radial-gradient(ellipse,#f9719e,#dc3e77 58%,transparent 76%)}
.chaos-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2;opacity:calc(var(--chaos)*.98)}.goo{position:absolute;inset:-10%;background:radial-gradient(circle at 12% 18%,#ff1768 0 7%,transparent 16%),radial-gradient(circle at 88% 22%,#c90049 0 10%,transparent 20%),radial-gradient(circle at 20% 78%,#ff2d7d 0 13%,transparent 25%),radial-gradient(circle at 80% 75%,#b90042 0 15%,transparent 29%);filter:blur(calc(2px + var(--chaos)*8px));animation:goo 1.3s ease-in-out infinite}@keyframes goo{50%{transform:scale(1.08)}}.heart{position:absolute;color:#ff2875;text-shadow:0 0 10px #ff005c,0 0 25px #ff005c;font-size:calc(32px + var(--chaos)*65px);animation:beat calc(1.5s - var(--chaos)*1s) ease-in-out infinite}.heart:after{content:"";position:absolute;left:50%;top:75%;width:7px;height:calc(var(--chaos)*70px);background:linear-gradient(#ff2875,transparent)}@keyframes beat{0%,35%,100%{transform:scale(1)}42%{transform:scale(calc(1 + var(--chaos)*.5))}52%{transform:scale(1)}60%{transform:scale(calc(1 + var(--chaos)*.7))}70%{transform:scale(1)}}.h1{left:2%;top:5%}.h2{right:3%;top:8%;animation-delay:.1s}.h3{left:8%;top:35%;animation-delay:.2s}.h4{right:8%;top:38%;animation-delay:.3s}.h5{left:3%;top:65%;animation-delay:.15s}.h6{right:3%;top:68%;animation-delay:.25s}.h7{left:24%;top:82%}.h8{right:25%;top:84%;animation-delay:.2s}.h9{left:43%;top:3%;animation-delay:.3s}.h10{left:45%;top:65%;animation-delay:.1s}.h11{left:22%;top:20%;animation-delay:.25s}.h12{right:20%;top:22%;animation-delay:.15s}
body.chaos{background:radial-gradient(circle,#4b001d,#130007 70%)}body.chaos .ticket{border-color:#ff3677;box-shadow:0 0 calc(35px + var(--chaos)*65px) rgba(255,0,85,.7),inset 0 0 calc(var(--chaos)*55px) rgba(255,0,85,.2);animation:tbeat calc(1.6s - var(--chaos)*1.05s) ease-in-out infinite}@keyframes tbeat{0%,35%,100%{transform:scale(1)}42%{transform:scale(calc(1 + var(--chaos)*.025))}52%{transform:scale(1)}59%{transform:scale(calc(1 + var(--chaos)*.045))}70%{transform:scale(1)}}body.maxed h1,body.maxed .sub,body.maxed .current,body.maxed .footer{animation:glitch .7s steps(1) infinite;text-shadow:3px 0 #ff0055,-3px 0 #650024,0 0 16px #ff0055}@keyframes glitch{75%{transform:translate(-3px,1px)}80%{transform:translate(4px,-1px)}85%{transform:translate(0)}}body.chaos .plus{border-color:#ff3d7b;box-shadow:0 0 20px rgba(255,0,85,.5)}body.maxed .plus{background:#25000e}.flash{position:fixed;inset:0;background:#ff0b61;opacity:0;pointer-events:none;z-index:99}.flash.hit{animation:flash .45s}@keyframes flash{20%{opacity:.4}50%{opacity:0}65%{opacity:.2}100%{opacity:0}}
@media(max-width:700px){.ticket{padding:14px 17px;max-height:calc(100svh - 16px)}.sub{margin:3px 0 7px}.current{margin:10px 0 2px}.real-glass{transform:scale(.82);margin-top:-13px;margin-bottom:-16px}.glass-zone{margin:0 0 4px;height:250px}.footer{margin-top:7px}}
</style></head><body><div class="chaos-layer"><div class="goo"></div><span class="heart h1">♥</span><span class="heart h2">♥</span><span class="heart h3">♥</span><span class="heart h4">♥</span><span class="heart h5">♥</span><span class="heart h6">♥</span><span class="heart h7">♥</span><span class="heart h8">♥</span><span class="heart h9">♥</span><span class="heart h10">♥</span><span class="heart h11">♥</span><span class="heart h12">♥</span></div><div class="flash" id="flash"></div>
<main class="ticket"><h1>利用回数カウンター</h1><div class="sub">彼の愛を、たくさん搾ってください♡</div><div class="rule"></div><div class="current">CURRENT USE</div><div class="count" id="count">0</div><div class="buttons"><div class="glass-zone"><div class="real-glass"><div class="rim"></div><div class="bowl"><div class="liquid-body" id="glassLiquid"><div class="liquid-wave"></div><div class="liquid-wave wave-front"></div></div></div><div class="stem"></div><div class="base"></div><div class="overflow" id="overflow"><div class="puddle"></div></div></div></div><button class="plus" id="plus">♡　＋1回追加　♡</button><button class="reset" id="reset">ごっくん♡</button></div><div class="footer">有効期限：無期限　　利用回数：<span style="font-size:20px">∞</span><br>♡ 好きなだけ、何度でも ♡</div></main>
<script>(()=>{let n=0;const C=document.getElementById("count"),L=document.getElementById("glassLiquid"),O=document.getElementById("overflow"),P=document.getElementById("plus"),R=document.getElementById("reset"),F=document.getElementById("flash"),mix=(a,b,t)=>Math.round(a+(b-a)*t);function hit(){F.classList.remove("hit");void F.offsetWidth;F.classList.add("hit")}function render(){let s=Math.min(n,20);C.textContent=s;let a=[244,218,157],b=[247,53,132],d=[235,43,48],c=s<=10?a.map((v,i)=>mix(v,b[i],s/10)):b.map((v,i)=>mix(v,d[i],(s-10)/10));C.style.color=`rgb(${c})`;C.style.textShadow=`0 0 ${6+s*.5}px rgba(${c},.48)`;if(!s){L.style.display="none";L.style.height="0%"}else{let l=Math.min(s,10),t=Math.max(0,(l-1)/9),x=[255,226,235],y=[244,104,151],q=x.map((v,i)=>mix(v,y[i],t));L.style.setProperty("--r",q[0]);L.style.setProperty("--g",q[1]);L.style.setProperty("--b",q[2]);L.style.display="block";L.style.height=l*10+"%"}O.style.display=s>10?"block":"none";let chaos=Math.min(s,5)/5;document.body.style.setProperty("--chaos",chaos);document.body.classList.toggle("chaos",s>=1);document.body.classList.toggle("maxed",s>=5)}P.onclick=()=>{if(n<20){n++;if(n<=5)hit()}render()};R.onclick=()=>{n=0;render()};render()})();</script></body></html>
