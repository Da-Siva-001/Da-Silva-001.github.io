<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Special Ticket</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;color:#f4dfb0;font-family:Georgia,"Times New Roman","Yu Mincho",serif;
}
.ticket{
  width:min(720px,100%);position:relative;padding:30px 28px 26px;
  border:2px solid #c9a45a;
  background:
    radial-gradient(circle at 20% 20%,#292929 0 1px,transparent 2px),
    linear-gradient(135deg,#111,#1b1b1b);
  box-shadow:0 0 35px #000;
}
.ticket:before{
  content:"";position:absolute;inset:11px;border:1px solid #7d6230;pointer-events:none
}
h1{text-align:center;margin:0;font-weight:500;font-size:clamp(34px,7vw,58px);letter-spacing:.05em}
.sub{text-align:center;font-size:clamp(16px,3.5vw,24px);margin:15px 0 23px}
.rule{height:1px;background:linear-gradient(90deg,transparent,#a88748 15%,#a88748 44%,transparent 44%,transparent 56%,#a88748 56%,#a88748 85%,transparent);position:relative}
.rule:after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:#161616;padding:0 12px;color:#d7ae5c}
.current{text-align:center;letter-spacing:.3em;font-size:13px;margin:24px 0 3px;color:#d8bd83}
.count{
  text-align:center;font-family:Georgia,serif;font-size:clamp(110px,25vw,180px);
  line-height:1.02;font-weight:400;color:#f7dfad;
  text-shadow:0 0 22px rgba(201,164,90,.12);
  transition:color .3s ease,text-shadow .3s ease;
}
.buttons{width:min(500px,92%);margin:8px auto 0}
.plus,.reset{width:100%;font-family:inherit;cursor:pointer}
.plus{
  height:68px;border:1px solid #c9a45a;background:#181818;color:#f5dfae;
  font-size:22px;letter-spacing:.08em;box-shadow:inset 0 0 0 1px #493a20;
}
.reset{
  margin-top:14px;height:48px;border:1px solid #ff72a7;background:#d92f73;
  color:#fff1f7;font-size:15px;letter-spacing:.12em;
}
.footer{text-align:center;margin:26px 0 4px;font-size:13px;line-height:1.9;letter-spacing:.08em;color:#c8aa6f}
.infinity{font-size:20px;vertical-align:-2px}

.glass-zone{
  height:310px;display:flex;align-items:center;justify-content:center;
  margin:12px 0 26px;
}
.real-glass{position:relative;width:170px;height:290px}
.real-glass .bowl{
  position:absolute;top:14px;left:21px;width:128px;height:158px;
  border-left:2px solid rgba(255,255,255,.92);
  border-right:2px solid rgba(255,255,255,.92);
  border-bottom:2px solid rgba(255,255,255,.86);
  border-radius:5px 5px 62px 62px / 5px 5px 110px 110px;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 31% 25%,rgba(255,255,255,.20) 0 2%,transparent 12%),
    linear-gradient(100deg,rgba(255,255,255,.18),rgba(255,255,255,.035) 13%,transparent 28%,transparent 61%,rgba(255,255,255,.10) 78%,rgba(255,255,255,.20));
  box-shadow:inset 11px 0 15px rgba(255,255,255,.07),
             inset -11px 0 15px rgba(255,255,255,.07),
             0 0 7px rgba(255,255,255,.14);
}
.real-glass .rim{
  position:absolute;z-index:3;top:9px;left:20px;width:130px;height:14px;
  border:2px solid rgba(255,255,255,.98);border-radius:50%;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.50),0 0 6px rgba(255,255,255,.20);
}
.real-glass .stem{
  position:absolute;top:169px;left:80px;width:10px;height:84px;border-radius:4px;
  background:linear-gradient(90deg,rgba(255,255,255,.20),rgba(255,255,255,.88) 25%,rgba(255,255,255,.98) 47%,rgba(255,255,255,.48) 70%,rgba(255,255,255,.18));
}
.real-glass .base{
  position:absolute;top:247px;left:36px;width:98px;height:20px;
  border:2px solid rgba(255,255,255,.90);border-radius:50%;
}
.real-glass .shine{position:absolute;pointer-events:none;border-radius:50%;z-index:2}
.real-glass .shine-a{
  left:19px;top:25px;width:10px;height:84px;
  border-left:4px solid rgba(255,255,255,.46);
}
.real-glass .shine-b{
  right:15px;top:36px;width:8px;height:65px;
  border-right:3px solid rgba(255,255,255,.25);
}

.real-glass .liquid-body{
  position:absolute;z-index:0;left:-5px;right:-5px;bottom:-4px;
  height:0%;display:none;
  background:linear-gradient(90deg,
    rgba(var(--pink-r),var(--pink-g),var(--pink-b),.96),
    rgba(var(--pink-r),var(--pink-g),var(--pink-b),1),
    rgba(var(--pink-r),var(--pink-g),var(--pink-b),.96));
  transition:height .55s cubic-bezier(.22,.7,.25,1);
}
.real-glass .liquid-wave{
  position:absolute;width:190%;left:-45%;height:54px;top:-25px;
  border-radius:48% 52% 46% 54% / 65% 58% 42% 35%;
  background:rgba(var(--pink-r),var(--pink-g),var(--pink-b),.95);
}
.real-glass .wave-back{animation:waveBack 5.8s ease-in-out infinite}
.real-glass .wave-front{top:-18px;opacity:.86;animation:waveFront 5s ease-in-out infinite}

@keyframes waveBack{
  0%{transform:translateX(-18%) rotate(-5deg) scaleY(1.05)}
  25%{transform:translateX(-8%) rotate(-2deg) scaleY(.95)}
  50%{transform:translateX(18%) rotate(5deg) scaleY(1.05)}
  75%{transform:translateX(8%) rotate(2deg) scaleY(.95)}
  100%{transform:translateX(-18%) rotate(-5deg) scaleY(1.05)}
}
@keyframes waveFront{
  0%{transform:translateX(17%) rotate(4.5deg) scaleY(1.04)}
  25%{transform:translateX(7%) rotate(1.8deg) scaleY(.96)}
  50%{transform:translateX(-17%) rotate(-4.5deg) scaleY(1.04)}
  75%{transform:translateX(-7%) rotate(-1.8deg) scaleY(.96)}
  100%{transform:translateX(17%) rotate(4.5deg) scaleY(1.04)}
}

.overflow{
  display:none;position:absolute;inset:0;pointer-events:none;z-index:10;
}
.drop{
  position:absolute;width:12px;height:19px;border-radius:60% 40% 65% 35%;
  background:#ef4f89;animation:fall 1.55s linear infinite;
}
.d1{left:30px;top:100px}
.d2{right:28px;top:82px;animation-delay:.5s}
.d3{left:78px;top:120px;animation-delay:1s}
@keyframes fall{
  0%{transform:translateY(0) scale(.7);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(125px) scale(1.05);opacity:0}
}
.puddle{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:285px;height:65px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,
    rgba(249,113,158,.98),
    rgba(239,82,137,.96) 34%,
    rgba(220,62,119,.90) 57%,
    rgba(197,47,104,.62) 70%,
    transparent 78%);
}

html,body{min-height:100%}
body{
  min-height:100svh;height:100svh;overflow:hidden;padding:8px;
}
@media(max-width:700px){
  .ticket{
    padding:14px 17px;
    max-height:calc(100svh - 16px);
  }
  .ticket h1{margin:6px 0 5px}
  .sub{margin:3px 0 7px}
  .current{margin:10px 0 2px}
  .count{margin:0}
  .real-glass{
    transform:scale(.82);
    transform-origin:center center;
    margin-top:-13px;
    margin-bottom:-16px;
  }
  .glass-zone{margin:0 0 4px;height:250px}
  .footer{margin-top:7px}
}
</style>
</head>

<body>
<main class="ticket">
  <h1>利用回数カウンター</h1>
  <div class="sub">彼の愛を、たくさん搾ってください♡</div>
  <div class="rule"></div>

  <div class="current">CURRENT USE</div>
  <div class="count" id="count">0</div>

  <div class="buttons">
    <div class="glass-zone">
      <div class="real-glass">
        <div class="rim"></div>

        <div class="bowl">
          <div class="liquid-body" id="glassLiquid">
            <div class="liquid-wave wave-back"></div>
            <div class="liquid-wave wave-front"></div>
          </div>
          <div class="shine shine-a"></div>
          <div class="shine shine-b"></div>
        </div>

        <div class="stem"></div>
        <div class="base"></div>

        <div class="overflow" id="overflow">
          <div class="drop d1"></div>
          <div class="drop d2"></div>
          <div class="drop d3"></div>
          <div class="puddle"></div>
        </div>
      </div>
    </div>

    <button class="plus" id="plus">♡　＋1回追加　♡</button>
    <button class="reset" id="reset">ごっくん♡</button>
  </div>

  <div class="footer">
    有効期限：無期限　　利用回数：<span class="infinity">∞</span><br>
    ♡ 好きなだけ、何度でも ♡
  </div>
</main>

<script>
(() => {
  let n = 0;

  const count = document.getElementById("count");
  const liquid = document.getElementById("glassLiquid");
  const overflow = document.getElementById("overflow");
  const plus = document.getElementById("plus");
  const reset = document.getElementById("reset");

  const mix = (a,b,t) => Math.round(a + (b-a)*t);

  function render(){
    const shown = Math.min(n,20);
    count.textContent = shown;

    const gold=[244,218,157];
    const pink=[247,53,132];
    const red=[235,43,48];

    let c;

    if(shown <= 10){
      const t = shown/10;
      c = gold.map((v,i)=>mix(v,pink[i],t));
    }else{
      const t = (shown-10)/10;
      c = pink.map((v,i)=>mix(v,red[i],t));
    }

    count.style.color = `rgb(${c.join(",")})`;
    count.style.textShadow =
      `0 0 ${6+shown*.5}px rgba(${c.join(",")},.48)`;

    if(shown === 0){
      liquid.style.display = "none";
      liquid.style.height = "0%";
    }else{
      const level = Math.min(shown,10);
      const t = Math.max(0,(level-1)/9);

      const start=[255,226,235];
      const end=[244,104,151];
      const lc=start.map((v,i)=>mix(v,end[i],t));

      liquid.style.setProperty("--pink-r",lc[0]);
      liquid.style.setProperty("--pink-g",lc[1]);
      liquid.style.setProperty("--pink-b",lc[2]);

      liquid.style.display = "block";
      liquid.style.height = (level*10)+"%";
    }

    overflow.style.display = shown > 10 ? "block" : "none";
  }

  plus.addEventListener("click",()=>{
    if(n < 20) n++;
    render();
  });

  reset.addEventListener("click",()=>{
    n=0;
    render();
  });

  render();
})();
</script>
</body>
</html>
