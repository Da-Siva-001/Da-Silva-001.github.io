<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Special Ticket</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#111; color:#f4dfb0; font-family:Georgia,"Times New Roman",serif;
    padding:20px;
  }
  .ticket{
    width:min(720px,100%); border:2px solid #c9a45a; padding:28px;
    background:
      radial-gradient(circle at 20% 20%,#292929 0 1px,transparent 2px),
      linear-gradient(135deg,#111,#1b1b1b);
    box-shadow:0 0 35px #000; position:relative;
  }
  .ticket:before,.ticket:after{
    content:""; position:absolute; top:0; bottom:0; width:12px;
    border-left:1px solid #7d6230; border-right:1px solid #7d6230;
  }
  .ticket:before{left:10px}.ticket:after{right:10px}
  .inner{border:1px solid #7d6230; padding:30px 24px; text-align:center}
  .eyebrow{letter-spacing:5px;font-size:13px}
  h1{font-size:clamp(28px,7vw,52px); margin:12px 0 4px; letter-spacing:2px}
  .sub{font-size:18px; margin:0 0 28px}
  .heart{font-size:30px}
  .count{
    font-family:Arial,sans-serif; font-size:clamp(70px,20vw,130px);
    font-weight:700; line-height:1; color:#fff; margin:18px 0;
  }
  .label{font-size:14px; letter-spacing:3px}
  button{
    border:1px solid #d4b36b; background:#7d1526; color:#fff;
    padding:13px 28px; font-size:18px; cursor:pointer; border-radius:4px;
    margin:6px;
  }
  button:hover{filter:brightness(1.15)}
  .reset{background:#242424;color:#d8c28d;font-size:13px}
  .note{font-family:Arial,sans-serif;font-size:12px;color:#bcae90;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<div class="ticket">
  <div class="inner">
    <div class="heart">♥</div>
    <div class="eyebrow">BIRTHDAY SPECIAL TICKET</div>
    <h1>利用回数カウンター</h1>
    <p class="sub">彼の愛を、たくさん搾ってください♡</p>
    <div class="label">CURRENT USE</div>
    <div id="count" class="count">0</div>
    <button onclick="add()">＋ 1回追加</button>
    <button class="reset" onclick="resetCount()">リセット</button>
    <div class="note">
      有効期限：無期限　　利用回数：♾<br>
      ※このページを開いた端末のブラウザに回数を保存します。
    </div>
  </div>
</div>
<script>
const KEY="birthday-special-ticket-count";
let count=Number(localStorage.getItem(KEY)||0);
function render(){document.getElementById("count").textContent=count;}
function add(){count++;localStorage.setItem(KEY,count);render();}
function resetCount(){
  if(confirm("カウントを0に戻しますか？")){
    count=0;localStorage.setItem(KEY,count);render();
  }
}
render();
</script>
</body>
</html>
