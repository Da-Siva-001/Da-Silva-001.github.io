<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Birthday Special Ticket</title>

<style>
*{box-sizing:border-box}

:root{
  --level:0;
  --beat:.95s;
  --power:0;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#111;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  overflow:hidden;
  color:#f4dfb0;
  font-family:Georgia,"Times New Roman","Yu Mincho",serif;
  transition:
    background .6s ease,
    filter .6s ease;
}

/* =========================
   背景
========================= */

body::before{
  content:"";
  position:fixed;
  inset:-15%;
  pointer-events:none;
  z-index:0;
  opacity:calc(var(--power) * .82);
  background:
    radial-gradient(circle at 20% 20%,
      rgba(255,40,115,.85),
      transparent 30%),
    radial-gradient(circle at 80% 35%,
      rgba(190,0,55,.75),
      transparent 34%),
    radial-gradient(circle at 50% 90%,
      rgba(255,0,90,.65),
      transparent 40%);
  animation:bgBeat var(--beat) infinite;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  opacity:calc(var(--power) * .45);
  background:
    repeating-radial-gradient(
      circle at 50% 50%,
      rgba(255,70,135,.12) 0 5px,
      transparent 7px 19px
    );
  animation:bgMove 2s linear infinite;
}

@keyframes bgBeat{
  0%,100%{
    transform:scale(1);
    filter:brightness(1);
  }
  10%{
    transform:scale(calc(1 + var(--power) * .035));
    filter:brightness(calc(1 + var(--power) * .55));
  }
  18%{
    transform:scale(1);
  }
  28%{
    transform:scale(calc(1 + var(--power) * .055));
  }
  38%{
    transform:scale(1);
  }
}

@keyframes bgMove{
  from{transform:rotate(0deg) scale(1.1)}
  to{transform:rotate(360deg) scale(1.1)}
}

/* =========================
   チケット
========================= */

.ticket{
  width:min(720px,100%);
  position:relative;
  z-index:10;
  padding:30px 28px 26px;
  border:2px solid #c9a45a;
  overflow:visible;

  background:
    radial-gradient(circle at 20% 20%,
      #292929 0 1px,
      transparent 2px),
    linear-gradient(135deg,#111,#1b1b1b);

  box-shadow:
    0 0 35px #000,
    0 0 calc(var(--power) * 55px)
      rgba(255,20,95,.85);

  animation:ticketBeat var(--beat) infinite;
}

@keyframes ticketBeat{
  0%,100%{
    transform:scale(1);
  }

  9%{
    transform:scale(
      calc(1 + var(--power) * .018)
    );
  }

  17%{
    transform:scale(1);
  }

  26%{
    transform:scale(
      calc(1 + var(--power) * .032)
    );
  }

  36%{
    transform:scale(1);
  }
}

/* 金の装飾 */

.ticket::before,
.ticket::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:11px;
  border-left:1px solid #7d6230;
  border-right:1px solid #7d6230;
}

.ticket::before{left:9px}
.ticket::after{right:9px}

/* =========================
   ドロドロ
========================= */

.goo{
  position:absolute;
  pointer-events:none;
  z-index:-1;
  opacity:calc(var(--power) * 1);
  transition:opacity .4s;
}

.goo.top{
  top:-15px;
  left:5%;
  width:90%;
  height:38px;

  background:
    radial-gradient(circle at 8% 40%,#ff347d 0 11px,transparent 12px),
    radial-gradient(circle at 20% 70%,#d90052 0 15px,transparent 16px),
    radial-gradient(circle at 37% 45%,#ff5a94 0 18px,transparent 19px),
    radial-gradient(circle at 53% 80%,#c90045 0 14px,transparent 15px),
    radial-gradient(circle at 70% 45%,#ff2c73 0 17px,transparent 18px),
    radial-gradient(circle at 87% 65%,#e00055 0 13px,transparent 14px);

  filter:
    blur(calc(var(--power) * 1.5px))
    drop-shadow(0 0 14px #ff236e);

  animation:gooMove calc(1.4s - var(--power) * .5s)
    ease-in-out infinite;
}

.goo.bottom{
  bottom:-24px;
  left:8%;
  width:84%;
  height:48px;

  background:
    radial-gradient(ellipse at 10% 30%,#e00055 0 22px,transparent 23px),
    radial-gradient(ellipse at 28% 45%,#ff4b8a 0 28px,transparent 29px),
    radial-gradient(ellipse at 48% 30%,#c60048 0 31px,transparent 32px),
    radial-gradient(ellipse at 68% 45%,#ff3a80 0 28px,transparent 29px),
    radial-gradient(ellipse at 88% 30%,#d00050 0 21px,transparent 22px);

  filter:
    blur(calc(var(--power) * 2px))
    drop-shadow(0 0 18px #ff246f);

  animation:gooMove .75s ease-in-out infinite alternate;
}

@keyframes gooMove{
  from{
    transform:scaleX(.96) translateY(0);
  }
  to{
    transform:scaleX(1.05)
      translateY(calc(var(--power) * 6px));
  }
}

/* =========================
   文字
========================= */

h1{
  margin:0;
  text-align:center;
  letter-spacing:.14em;
  font-size:clamp(21px,6vw,34px);
}

.subtitle{
  text-align:center;
  margin-top:8px;
  font-size:14px;
  opacity:.9;
}

.current{
  text-align:center;
  margin-top:25px;
  letter-spacing:.3em;
  font-size:11px;
  opacity:.7;
}

.glitch{
  position:relative;
}

body.chaos .glitch{
  animation:
    glitchShake calc(1.3s - var(--power) * .8s)
    steps(2,end) infinite;
}

@keyframes glitchShake{
  0%,90%,100%{
    transform:translate(0);
    text-shadow:none;
  }

  91%{
    transform:
      translate(
        calc(var(--power) * -3px),
        calc(var(--power) * 2px)
      );

    text-shadow:
      calc(var(--power) * 4px) 0 #ff1767,
      calc(var(--power) * -4px) 0 #fff;
  }

  94%{
    transform:
      translate(
        calc(var(--power) * 4px),
        calc(var(--power) * -2px)
      );
  }

  97%{
    transform:
      translate(
        calc(var(--power) * -2px),
        0
      );
  }
}

/* =========================
   数字
   ※デザインは暴走させない
========================= */

.count{
  text-align:center;
  font-size:clamp(76px,24vw,130px);
  line-height:.95;
  margin:12px 0 16px;
  font-weight:bold;
  color:#d4af62;

  text-shadow:
    0 2px 0 #5c4217,
    0 0 18px rgba(212,175,98,.25);

  transition:
    color .35s,
    text-shadow .35s;
}

/* =========================
   グラス
========================= */

.glass-wrap{
  display:flex;
  justify-content:center;
  margin:8px 0 22px;
}

.glass{
  width:94px;
  height:118px;
  position:relative;
  overflow:hidden;

  border-left:4px solid rgba(255,255,255,.62);
  border-right:4px solid rgba(255,255,255,.62);
  border-bottom:5px solid rgba(255,255,255,.68);

  border-radius:5px 5px 22px 22px;

  box-shadow:
    inset 0 0 16px rgba(255,255,255,.12),
    0 0 calc(var(--power) * 28px)
      rgba(255,45,110,.8);
}

.liquid{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0%;

  background:
    linear-gradient(
      to top,
      #ff1768,
      #ff70a4
    );

  transition:height .6s cubic-bezier(.2,.8,.2,1);

  box-shadow:
    0 -8px 20px rgba(255,70,130,.5);
}

.liquid::before{
  content:"";
  position:absolute;
  left:-15%;
  width:130%;
  height:18px;
  top:-9px;

  background:#ff77a7;
  border-radius:50%;

  animation:wave calc(1.7s - var(--power) * .8s)
    ease-in-out infinite alternate;
}

@keyframes wave{
  from{
    transform:translateX(-4px)
      rotate(-2deg);
  }
  to{
    transform:translateX(4px)
      rotate(2deg);
  }
}

/* =========================
   ボタン
========================= */

.buttons{
  display:flex;
  flex-direction:column;
  gap:10px;
}

button{
  appearance:none;
  border:none;
  cursor:pointer;
  font:inherit;
}

.plus{
  padding:15px;
  border:1px solid #c9a45a;
  color:#111;
  font-weight:bold;
  font-size:20px;

  background:
    linear-gradient(
      135deg,
      #f6e5ad,
      #c99f50
    );

  box-shadow:
    0 5px 20px rgba(0,0,0,.5);
}

.reset{
  padding:10px;
  background:transparent;
  color:#c9a45a;
  border:1px solid #66522e;
}

.footer{
  text-align:center;
  margin-top:18px;
  font-size:12px;
  letter-spacing:.08em;
  opacity:.75;
}

/* =========================
   ハート
========================= */

.hearts{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  overflow:hidden;
}

.heart{
  position:absolute;
  opacity:0;
  transform:scale(0);

  filter:
    drop-shadow(0 0 8px #ff2a74)
    drop-shadow(0 0 16px rgba(255,0,80,.5));

  transition:
    opacity .35s,
    transform .35s;

  animation:
    heartFloat var(--speed,1s)
    ease-in-out infinite alternate;
}

.heart.on{
  opacity:
    calc(.35 + var(--power) * .65);

  transform:
    scale(
      calc(.55 + var(--power) * .75)
    );
}

@keyframes heartFloat{
  from{
    margin-top:-6px;
  }
  to{
    margin-top:8px;
  }
}

.h1{left:3%;top:8%;font-size:36px;--speed:.62s}
.h2{right:5%;top:10%;font-size:50px;--speed:.54s}
.h3{left:8%;top:28%;font-size:48px;--speed:.72s}
.h4{right:7%;top:31%;font-size:32px;--speed:.48s}
.h5{left:2%;top:52%;font-size:60px;--speed:.56s}
.h6{right:2%;top:56%;font-size:54px;--speed:.68s}
.h7{left:12%;bottom:9%;font-size:45px;--speed:.52s}
.h8{right:11%;bottom:8%;font-size:60px;--speed:.58s}
.h9{left:38%;top:4%;font-size:30px;--speed:.45s}
.h10{right:36%;bottom:4%;font-size:42px;--speed:.5s}

.h11{left:23%;top:16%;font-size:28px;--speed:.42s}
.h12{right:20%;top:21%;font-size:35px;--speed:.4s}
.h13{left:20%;bottom:27%;font-size:38px;--speed:.46s}
.h14{right:21%;bottom:24%;font-size:30px;--speed:.38s}
.h15{left:44%;bottom:12%;font-size:55px;--speed:.44s}
.h16{right:43%;top:14%;font-size:45px;--speed:.36s}

/* =========================
   MAX時
========================= */

body.max{
  background:#25000e;
}

body.max .ticket{
  border-color:#ff4a86;

  box-shadow:
    0 0 20px #ff276d,
    0 0 55px rgba(255,0,75,.85),
    0 0 100px rgba(180,0,50,.7);
}

body.max .goo{
  filter:
    drop-shadow(0 0 14px #ff1f69)
    drop-shadow(0 0 28px #ff0050);
}

/* =========================
   クリック時フラッシュ
========================= */

.flash{
  position:fixed;
  inset:0;
  z-index:100;
  pointer-events:none;
  opacity:0;
  background:#ff337d;
}

.flash.hit{
  animation:flashHit .32s ease-out;
}

@keyframes flashHit{
  0%{opacity:.55}
  100%{opacity:0}
}

/* スマホ */

@media(max-width:500px){
  body{
    padding:14px;
  }

  .ticket{
    padding:24px 22px 22px;
  }

  .count{
    margin-top:8px;
  }
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<div class="hearts" id="hearts">
  <span class="heart h1">♥</span>
  <span class="heart h2">♥</span>
  <span class="heart h3">♥</span>
  <span class="heart h4">♥</span>
  <span class="heart h5">♥</span>
  <span class="heart h6">♥</span>
  <span class="heart h7">♥</span>
  <span class="heart h8">♥</span>
  <span class="heart h9">♥</span>
  <span class="heart h10">♥</span>
  <span class="heart h11">♥</span>
  <span class="heart h12">♥</span>
  <span class="heart h13">♥</span>
  <span class="heart h14">♥</span>
  <span class="heart h15">♥</span>
  <span class="heart h16">♥</span>
</div>

<main class="ticket" id="ticket">

  <div class="goo top"></div>
  <div class="goo bottom"></div>

  <h1 class="glitch">
    利用回数カウンター
  </h1>

  <div class="subtitle glitch">
    彼の愛を、たくさん搾ってください♡
  </div>

  <div class="current glitch">
    CURRENT USE
  </div>

  <div class="count" id="count">
    0
  </div>

  <div class="glass-wrap">
    <div class="glass">
      <div class="liquid" id="liquid"></div>
    </div>
  </div>

  <div class="buttons">
    <button class="plus" id="plus">
      ＋1
    </button>

    <button class="reset" id="reset">
      ごっくん♡
    </button>
  </div>

  <div class="footer glitch">
    ♥ UNLIMITED USE ♥
  </div>

</main>

<script>
let n = 0;

const count = document.getElementById("count");
const liquid = document.getElementById("liquid");
const plus = document.getElementById("plus");
const reset = document.getElementById("reset");
const flash = document.getElementById("flash");
const hearts = [...document.querySelectorAll(".heart")];

/* -------------------------
   数字の色
------------------------- */

function mixColor(a,b,t){
  const ah=parseInt(a.replace("#",""),16);
  const bh=parseInt(b.replace("#",""),16);

  const ar=(ah>>16)&255;
  const ag=(ah>>8)&255;
  const ab=ah&255;

  const br=(bh>>16)&255;
  const bg=(bh>>8)&255;
  const bb=bh&255;

  const r=Math.round(ar+(br-ar)*t);
  const g=Math.round(ag+(bg-ag)*t);
  const bl=Math.round(ab+(bb-ab)*t);

  return `rgb(${r},${g},${bl})`;
}

function numberColor(value){

  if(value<=10){
    return mixColor(
      "#d4af62",
      "#ff5c96",
      value/10
    );
  }

  return mixColor(
    "#ff5c96",
    "#ff174f",
    (value-10)/10
  );
}

/* -------------------------
   暴走レベル
------------------------- */

function setChaos(value){

  /*
    0 = 0%
    1 = 20%
    2 = 40%
    3 = 60%
    4 = 80%
    5以上 = 100%
  */

  const capped = Math.min(value,5);
  const power = capped / 5;

  document.documentElement.style
    .setProperty("--power",power);

  /* ドクドク速度
     0回はアニメーションしていても
     power=0なので見た目は動かない
  */

  const beat =
    1.15 - (power * .78);

  document.documentElement.style
    .setProperty(
      "--beat",
      beat.toFixed(2)+"s"
    );

  if(value>0){
    document.body.classList.add("chaos");
  }else{
    document.body.classList.remove("chaos");
  }

  if(value>=5){
    document.body.classList.add("max");
  }else{
    document.body.classList.remove("max");
  }

  /*
    ハート数
    1回  約20%
    2回  約40%
    ...
    5回  全部
  */

  const visibleHearts =
    Math.ceil(hearts.length * power);

  hearts.forEach((heart,i)=>{
    heart.classList.toggle(
      "on",
      i < visibleHearts
    );
  });
}

/* -------------------------
   更新
------------------------- */

function update(){

  count.textContent=n;

  count.style.color=
    numberColor(n);

  /*
    グラスは10回で満タン
    11〜20も満タン維持
  */

  const fill =
    Math.min(n,10)*10;

  liquid.style.height=
    fill+"%";

  setChaos(n);
}

/* -------------------------
   フラッシュ
------------------------- */

function hit(){

  flash.classList.remove("hit");

  void flash.offsetWidth;

  flash.classList.add("hit");
}

/* -------------------------
   ＋1
------------------------- */

plus.addEventListener("click",()=>{

  if(n>=20){
    return;
  }

  n++;

  /*
    1〜5だけ、
    暴走が強くなるタイミングで
    軽くフラッシュ
  */

  if(n<=5){
    hit();
  }

  update();
});

/* -------------------------
   リセット
------------------------- */

reset.addEventListener("click",()=>{

  n=0;

  update();
});

/* 初期状態 */

update();
</script>

</body>
</html>
